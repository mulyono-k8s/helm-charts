
namespace: app # <-- KAMU BISA TAMBAHKAN SENDIRI DI SINI
replicaCount: 1

image:
  repository: referral-web-image
  tag: latest
  pullPolicy: Never # Sangat penting untuk Docker Desktop lokal agar tidak pull dari hub online

service:
  type: NodePort
  port: 80
  targetPort: 80
  nodePort: 30080

ingress:
  enabled: false
  className: "nginx"
  host: referral-web.local