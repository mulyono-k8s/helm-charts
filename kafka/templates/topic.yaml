{{- if .Values.topic.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .Values.topic.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.name" . }}
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  partitions: {{ .Values.topic.partitions }}
  replicas: {{ .Values.topic.replicas }}
  {{- with .Values.topic.config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
