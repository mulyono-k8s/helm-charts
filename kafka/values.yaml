namespace: kafka
kafka:
  name: kafka
  version: "4.2.1"
  # Single-node settings are for development/testing only.
  replicas: 1
  listener:
    name: plain
    port: 9092
    tls: false
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1

nodePool:
  name: kafka
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim  #ephemeral # use persistent for PVC-backed storage
    size: 10Gi
    deleteClaim: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

topic:
  enabled: false
  name: demo-topic
  partitions: 1
  replicas: 1
  config: {}
