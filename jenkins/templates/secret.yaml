apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  jenkins-admin-user: {{ .Values.admin.user | b64enc | quote }}
  jenkins-admin-password: {{ .Values.admin.password | b64enc | quote }}
